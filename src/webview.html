<!DOCTYPE html>

<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>添加代码评审注释</title>

    <style>
      /* 输入框样式 */
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 0px;
        box-sizing: border-box;
      }

      body.vscode-light {
        color: black;
      }

      body.vscode-dark {
        color: white;
      }

      form.note-form {
        padding-top: 20px;
      }

      .action-btn {
        border: none;
        width: auto;
        padding: 2px 14px;
        height: 30px;
        display: inline-block;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.42857143;
        text-align: center;
        white-space: nowrap;
        vertical-align: middle;
        user-select: none;
      }

      .action-btn:disabled {
        background-color: rgb(239, 240, 241);
        cursor: not-allowed;
        color: black;
      }

      .primary {
        color: var(--vscode-button-foreground);
        background-color: var(--vscode-button-background);
      }

      .primary:hover {
        background-color: var(--vscode-button-hoverBackground);
      }

      .secondary {
        color: var(--vscode-button-secondaryForeground);
        background-color: var(--vscode-button-secondaryBackground);
      }

      .secondary:hover {
        background-color: var(--vscode-button-secondaryHoverBackground);
      }

      /* 按钮组 */
      .actions {
        padding-top: 1em;
        display: flex;
        justify-content: space-between;
        gap: 1em;
      }

      .actions-left {
        display: flex;
        gap: 1em;
      }

      #delete-button {
        visibility: hidden;
      }

      /* 优先级选择器（红绿灯） */
      #traffic-light {
        display: block;
        background-color: #333;
        width: 50px;
        height: 130px;
        border-radius: 15px;
      }

      input.traffic-light-color {
        appearance: none;
        position: relative;
        top: 10px;
        width: 30px;
        height: 30px;
        margin-top: 10px;
        margin-left: 10px;
        background-color: grey;
        vertical-align: middle;
        border-radius: 100%;
        display: block;
        user-select: none;
        outline: none;
      }

      input#prio-3 {
        background-color: #b30000;
      }

      input#prio-3:checked {
        background-color: #ff0000;
        box-shadow: 0 0 3em #ff3333;
      }

      input#prio-2 {
        background-color: #b2b300;
      }

      input#prio-2:checked {
        background-color: #ffff00;
        box-shadow: 0 0 3em #ffff33;
      }

      input#prio-1 {
        background-color: #00b300;
      }

      input#prio-1:checked {
        background-color: #00ff00;
        box-shadow: 0 0 3em #33ff33;
      }

      /* 表单布局 */
      .form-container {
        display: flex;
      }

      .col-right {
        padding-left: 20px;
        justify-self: center;
      }
    </style>
  </head>

  <body>
    <h2>{{filename}}</h2>

    <form class="note-form">
      <div class="form-container">
        <div class="col-left">
          <label for="title">标题</label>
          <input id="title" name="title" type="text" placeholder="简短描述（例如：'方法过于复杂'）" />

          <label for="category">类别</label>
          <select id="category" name="category">
            <option value=""></option>
            {{{categories}}}
          </select>

          <label for="comment">详细描述</label>
          <textarea
            id="comment"
            name="comment"
            placeholder="详细说明（例如：'将方法拆分为更小的函数和工具类'）"
            rows="5"
          ></textarea>

          <label for="additional">附加信息</label>
          <input
            id="additional"
            name="additional"
            type="text"
            placeholder="附加信息或链接（例如：'http://example.com'）"
          />
        </div>

        <div class="col-right">
          <label id="priority">优先级</label>

          <div id="traffic-light" role="radiogroup" aria-labelledby="priority" tabindex="0">
            <input
              type="radio"
              class="traffic-light-color"
              name="traffic-light-color"
              id="prio-3"
              value="3"
              aria-label="优先级：高"
            />

            <input
              type="radio"
              class="traffic-light-color"
              name="traffic-light-color"
              id="prio-2"
              value="2"
              aria-label="优先级：中"
            />

            <input
              type="radio"
              class="traffic-light-color"
              name="traffic-light-color"
              id="prio-1"
              value="1"
              aria-label="优先级：低"
            />
          </div>

          <p>
            <label for="private">私有</label>
            <input id="private" name="private" type="checkbox" title="设为私有注释，仅自己可见" />
          </p>
        </div>
      </div>

      <div class="actions">
        <div class="actions-left">
          <button
            class="action-btn primary"
            tabindex="0"
            id="add"
            role="button"
            onclick="addNote()"
            title="保存注释（Ctrl+回车）"
          >
            添加注释
          </button>

          <button
            class="action-btn secondary"
            tabindex="0"
            role="button"
            onclick="cancel()"
            title="取消更改（Ctrl+Esc）"
          >
            取消
          </button>
        </div>

        <button
          class="action-btn secondary"
          tabindex="0"
          id="delete-button"
          role="button"
          onclick="deleteComment()"
          title="删除此注释（Ctrl+Delete）"
        >
          删除
        </button>
      </div>
    </form>

    <script>
      const vscode = acquireVsCodeApi();

      // 接收VS Code消息（编辑已有注释时）
      window.addEventListener('message', (event) => {
        document.getElementById('delete-button').style.visibility = 'visible';
        document.getElementById('add').innerHTML = '更新';
        document.getElementById('add').disabled = false;
        document.getElementById('title').value = event.data.comment.title || '';
        document.getElementById('comment').value = event.data.comment.comment || '';
        document.getElementById('additional').value = event.data.comment.additional || '';
        document.getElementById('category').value = event.data.comment.category;
        document.getElementById('private').checked = Number(event.data.comment.private) !== 0;

        if (event.data.comment.priority) {
          document.getElementById('prio-' + event.data.comment.priority).checked = true;
        }
      });

      const KEYCODE_ENTER = 13;
      const KEYCODE_ESC = 27;
      const KEYCODE_DELETE = 46;

      // 快捷键监听
      document.addEventListener(
        'keydown',
        (event) => {
          if (event.ctrlKey && !event.shiftKey && !event.altKey) {
            switch (event.keyCode) {
              case KEYCODE_ENTER:
                // Ctrl+回车：验证并提交注释
                if (!document.getElementById('add').disabled) {
                  event.stopPropagation();
                  addNote();
                }
                break;

              case KEYCODE_ESC:
                // Ctrl+Esc：取消注释
                cancel();
                break;

              case KEYCODE_DELETE:
                // Ctrl+Delete：删除注释
                deleteComment();
                break;
            }
          }
        },
        false,
      );

      // 自动聚焦到描述文本框
      document.getElementById('comment').focus();

      // 提交注释
      function addNote() {
        const title = document.getElementById('title').value;
        const comment = document.getElementById('comment').value;
        const trafficLightEl = document.querySelector('input[name=traffic-light-color]:checked');
        const priority = trafficLightEl ? trafficLightEl.value : 0;
        const category = document.getElementById('category').value;
        const additional = document.getElementById('additional').value;
        const private = document.getElementById('private').checked ? 1 : 0;

        const formData = {
          sha: '',
          filename: '',
          url: '',
          lines: '',
          title,
          comment,
          priority: Number(priority),
          category,
          additional,
          private: Number(private),
          code: '',
        };

        vscode.postMessage({
          command: 'submit',
          text: JSON.stringify(formData),
        });
      }

      // 取消操作
      function cancel() {
        vscode.postMessage({
          command: 'cancel',
          text: 'cancel',
        });
      }

      // 删除注释
      function deleteComment() {
        vscode.postMessage({
          command: 'delete',
          text: 'delete',
        });
      }
    </script>
  </body>
</html>
